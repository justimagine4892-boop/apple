# Fly.io deployment. Edit `app` to your own name, then:
#   fly launch --no-deploy --copy-config
#   fly volumes create wa_data --size 1 --region lhr
#   fly secrets set ANTHROPIC_API_KEY=... ADMIN_TOKEN=... PAIRING_NUMBER=...
#   fly deploy
app = "wa-autoreply"
primary_region = "lhr"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  LOG_LEVEL = "info"

# A WhatsApp socket is a single long-lived connection holding the session's
# signal state. Two instances would fight over one linked device, so this app
# must never scale past one machine and must never auto-stop.
[[mounts]]
  source = "wa_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
